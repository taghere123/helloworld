<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- viewport: sin zoom accidental, ocupa toda la pantalla en iPad/telefono -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd166">
<title>English Fun 🎉 — Juego de ingles para peques</title>
<style>
/* ============================================================
   ESTILOS — todo inline, sin dependencias externas
   Paleta brillante, botones enormes, bordes redondos
   ============================================================ */

:root{
  --amarillo:#ffd166;
  --naranja:#ff9f1c;
  --rosa:#ff5d8f;
  --morado:#8367c7;
  --azul:#2ec4f1;
  --verde:#3ddc84;
  --oscuro:#2b2d42;
  --blanco:#fffdf7;
  /* tamano de boton grande: nunca menor a 80px (requisito tactil) */
  --btn: clamp(80px, 18vmin, 130px);
  --sombra: 0 8px 0 rgba(0,0,0,.18), 0 12px 24px rgba(0,0,0,.18);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{ background:var(--blanco); }

html,body{
  margin:0; padding:0;
  width:100%;
  overflow-x:hidden;              /* nunca scroll horizontal */
  overscroll-behavior:none;       /* evita el "rebote" de iOS */
  color:var(--oscuro);
  font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;      /* mata el doble-tap-zoom en iOS */
}

body{
  background:transparent;         /* si no, taparia las manchitas del ::before */
  min-height:100vh;
  min-height:100dvh;              /* dvh = altura real en moviles con barra */
  display:flex; flex-direction:column;
}

/* fondo alegre con manchitas de color */
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(circle at 12% 18%, #ffe8a3 0 18vmin, transparent 18vmin),
    radial-gradient(circle at 88% 12%, #bdeaff 0 16vmin, transparent 16vmin),
    radial-gradient(circle at 78% 88%, #ffd0e0 0 20vmin, transparent 20vmin),
    radial-gradient(circle at 8% 85%, #d3ffd9 0 17vmin, transparent 17vmin),
    var(--blanco);
}

/* ---------- pantallas ---------- */
.pantalla{
  display:none;
  flex:1 1 auto;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,2.2vh,22px);
  padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  text-align:center;
  position:relative;
}
.pantalla.activa{ display:flex; }

/* ---------- splash: desbloqueo de audio en iOS ---------- */
#splash{
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(160deg,#ffd166,#ff9f1c 45%,#ff5d8f);
  color:#fff;
  cursor:pointer;
}
#splash h1{
  font-size:clamp(2.2rem,9vw,5rem);
  margin:0; text-shadow:0 4px 0 rgba(0,0,0,.18);
}
#splash .sub{ font-size:clamp(1rem,3.6vw,1.6rem); opacity:.95; margin:0; }
.play-grande{
  font-size:clamp(5rem,24vmin,12rem);
  line-height:1.15;              /* aire para que no toque el titulo */
  margin-bottom:clamp(4px,1.5vh,16px);
  animation:latir 1.4s ease-in-out infinite;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.25));
}

/* ---------- titulos ---------- */
h2.titulo{
  margin:0;
  font-size:clamp(1.5rem,6vw,3rem);
  color:var(--morado);
  text-shadow:0 3px 0 rgba(255,255,255,.9);
}

/* ---------- botones genericos ---------- */
button{
  font-family:inherit; color:inherit; cursor:pointer;
  border:none; background:none;
}
.btn{
  min-width:var(--btn); min-height:var(--btn);
  padding:0 clamp(14px,3vw,28px);
  border-radius:28px;
  background:var(--azul);
  color:#fff;
  font-size:clamp(1.1rem,4.2vw,2rem);
  font-weight:800;
  display:inline-flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
  box-shadow:var(--sombra);
  transition:transform .12s ease, filter .12s ease;
}
.btn .ico{ font-size:clamp(2rem,8vw,3.4rem); line-height:1.05; }
.btn .etq{ font-size:clamp(.7rem,2.6vw,1.05rem); letter-spacing:.5px; }
.btn:active{ transform:scale(.92) translateY(4px); filter:brightness(1.08); }
.btn.escuchar{ background:var(--morado); }
.btn.mic{ background:var(--rosa); }
.btn.listo{ background:var(--verde); color:#08351c; }
.btn.redondo{ border-radius:50%; padding:0; width:var(--btn); height:var(--btn); }

/* boton chico de esquina (casita) — sigue siendo tactilmente grande */
.esquina{
  position:absolute; top:max(10px, env(safe-area-inset-top)); left:12px;
  width:clamp(72px,13vmin,96px); height:clamp(72px,13vmin,96px);
  border-radius:50%;
  background:#fff; box-shadow:var(--sombra);
  font-size:clamp(2rem,6vmin,2.8rem);
  display:flex; align-items:center; justify-content:center;
  z-index:20;
}
.esquina:active{ transform:scale(.9); }

/* ---------- home: rejilla de temas ---------- */
#rejillaTemas{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(12px,3vw,26px);
  width:min(100%,760px);
  padding:0 clamp(6px,2vw,16px);
}
.tema-btn{
  aspect-ratio:1/1;
  min-height:clamp(110px,22vh,220px);
  border-radius:34px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
  color:#fff; font-weight:900;
  box-shadow:var(--sombra);
  transition:transform .15s ease;
  animation:aparecer .45s backwards;
}
.tema-btn .ico{ font-size:clamp(2.8rem,13vmin,6rem); line-height:1; }
.tema-btn .nombre{ font-size:clamp(.9rem,3.6vw,1.6rem); text-shadow:0 2px 0 rgba(0,0,0,.18); }
.tema-btn:active{ transform:scale(.93) rotate(-2deg); }

/* ---------- estrellas de progreso ---------- */
#estrellas{
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:clamp(2px,1vw,8px);
  font-size:clamp(1.2rem,5vw,2.2rem);
  line-height:1;
  max-width:96vw;
  /* pildora translucida: las estrellas se leen bien sobre cualquier fondo */
  background:rgba(255,255,255,.65);
  border-radius:999px;
  padding:8px clamp(10px,3vw,18px);
}
#estrellas span{ transition:transform .3s ease; filter:grayscale(1) opacity(.35); }
#estrellas span.on{ filter:none; transform:scale(1.15); }
#estrellas span.pop{ animation:pop .5s ease; }

/* ---------- tarjeta ---------- */
#tarjeta{
  width:min(88vw,560px);
  min-height:min(40vh,360px);
  border-radius:44px;
  background:#fff;
  box-shadow:0 12px 0 rgba(0,0,0,.12), 0 18px 40px rgba(0,0,0,.18);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(6px,2vh,18px);
  padding:clamp(12px,3vh,28px) 14px;
  animation:entrarTarjeta .45s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;
}
#tarjeta.correcto{ animation:brincar .6s ease; }
#dibujo{
  font-size:clamp(4.5rem,26vmin,11rem);
  line-height:1;
  animation:flotar 2.6s ease-in-out infinite;
}
/* para el tema de numeros: varios emojis en rejilla */
#dibujo.grupo{
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
  gap:clamp(2px,1.4vmin,10px);
  font-size:clamp(1.6rem,9vmin,4.2rem);
  max-width:100%;
  animation:none;
}
#palabra{
  font-size:clamp(2rem,11vmin,5rem);
  font-weight:900;
  letter-spacing:.08em;
  color:var(--oscuro);
  margin:0;
}

/* ---------- fila de botones del juego ---------- */
.fila-controles{
  display:flex; flex-wrap:wrap;
  align-items:center; justify-content:center;
  gap:clamp(10px,3vw,24px);
  width:100%;
}

/* estado "escuchando" del microfono */
.btn.mic.oyendo{ animation:pulso .9s ease-in-out infinite; background:#e0175f; }

/* mensajito de animo (no da miedo) */
#animo{
  min-height:1.6em;
  font-size:clamp(1rem,4vw,1.6rem);
  font-weight:800;
  color:var(--morado);
}
#notaMic{
  font-size:clamp(.7rem,2.6vw,.95rem);
  opacity:.55; margin:0; max-width:90vw;
}

/* ---------- celebracion ---------- */
#final .trofeo{ font-size:clamp(5rem,28vmin,12rem); animation:brincar 1.1s ease-in-out infinite; }
#final .lluviaEstrellas{ font-size:clamp(1.6rem,7vw,3rem); letter-spacing:.15em; }

/* ---------- confeti ---------- */
#confeti{ position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
#confeti i{
  position:absolute; top:-12vh;
  font-size:clamp(1.4rem,5vw,2.6rem);
  font-style:normal;
  animation:caer linear forwards;
}

/* ---------- animaciones ---------- */
@keyframes latir{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
@keyframes flotar{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes brincar{ 0%,100%{transform:scale(1)} 30%{transform:scale(1.12) rotate(-3deg)} 60%{transform:scale(.96) rotate(2deg)} }
@keyframes pulso{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
@keyframes pop{ 0%{transform:scale(.4)} 60%{transform:scale(1.6)} 100%{transform:scale(1.15)} }
@keyframes aparecer{ from{opacity:0; transform:translateY(18px) scale(.9)} to{opacity:1; transform:none} }
@keyframes entrarTarjeta{ from{opacity:0; transform:translateY(28px) scale(.86)} to{opacity:1; transform:none} }
@keyframes caer{ to{ transform:translateY(115vh) rotate(var(--giro)); opacity:.9; } }

/* respeta a quien prefiere menos movimiento */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

/* ---------- horizontal en tablet/telefono: tarjeta y botones lado a lado ---------- */
@media (orientation:landscape) and (max-height:560px){
  #juego{ flex-direction:row; flex-wrap:wrap; gap:2vw; }
  #tarjeta{ width:min(52vw,460px); min-height:min(70vh,340px); }
  .fila-controles{ flex-direction:column; width:auto; }
  #estrellas{ position:absolute; top:6px; left:0; right:0; }
  #animo{ position:absolute; bottom:6px; left:0; right:0; }
}
@media (orientation:landscape){
  #rejillaTemas{ grid-template-columns:repeat(4,minmax(0,1fr)); width:min(100%,1000px); }
  .tema-btn{ min-height:clamp(100px,30vh,220px); }
}
</style>
</head>
<body>

<!-- =========================================================
     PANTALLA 1 — SPLASH (imprescindible para desbloquear audio en iOS)
     ========================================================= -->
<section id="splash" class="pantalla activa">
  <div class="play-grande">▶️</div>
  <h1>English Fun</h1>
  <p class="sub">👆 Toca para empezar</p>
</section>

<!-- =========================================================
     PANTALLA 2 — HOME (elegir tema)
     ========================================================= -->
<section id="home" class="pantalla">
  <h2 class="titulo">🌈 ¡Elige un mundo!</h2>
  <div id="rejillaTemas"></div>
</section>

<!-- =========================================================
     PANTALLA 3 — JUEGO
     ========================================================= -->
<section id="juego" class="pantalla">
  <button class="esquina" id="btnCasa" aria-label="Inicio">🏠</button>
  <div id="estrellas"></div>

  <div id="tarjeta">
    <div id="dibujo">🐶</div>
    <p id="palabra">DOG</p>
  </div>

  <div class="fila-controles">
    <button class="btn escuchar" id="btnEscuchar">
      <span class="ico">🔊</span><span class="etq">Listen</span>
    </button>
    <button class="btn mic" id="btnMic">
      <span class="ico">🎤</span><span class="etq">Say it</span>
    </button>
    <button class="btn listo" id="btnListo">
      <span class="ico">✅</span><span class="etq">I said it!</span>
    </button>
  </div>

  <div id="animo"></div>
  <p id="notaMic" hidden>🎤 El micrófono no está disponible en este dispositivo</p>
</section>

<!-- =========================================================
     PANTALLA 4 — CELEBRACION FINAL
     ========================================================= -->
<section id="final" class="pantalla">
  <div class="trofeo">🏆</div>
  <h2 class="titulo">¡Muy bien! 🎉</h2>
  <div class="lluviaEstrellas" id="estrellasFinal">⭐⭐⭐</div>
  <div class="fila-controles">
    <button class="btn redondo" id="btnHomeFinal" style="background:var(--naranja)"><span class="ico">🏠</span></button>
    <button class="btn redondo" id="btnOtraVez" style="background:var(--verde)"><span class="ico">🔁</span></button>
  </div>
</section>

<div id="confeti"></div>

<script>
"use strict";
/* ================================================================
   ⬇⬇⬇  ZONA DE CONFIGURACION — EDITA SOLO ESTO PARA AÑADIR CONTENIDO ⬇⬇⬇
   ================================================================

   Cada tema es un objeto:
     id       : identificador unico (texto)
     icono    : emoji del boton del menu
     nombre   : nombre que se ve en el boton
     color    : color de fondo del boton del menu
     palabras : lista de tarjetas. Cada tarjeta acepta:
        en      -> palabra en ingles (se muestra y se pronuncia)  [OBLIGATORIO]
        emoji   -> dibujo grande de la tarjeta                    [OBLIGATORIO]
        fondo   -> (opcional) color de fondo de la tarjeta (temas de colores)
        texto   -> (opcional) color del texto si el fondo es oscuro
        cantidad-> (opcional) repite el emoji N veces (tema de numeros)
        extra   -> (opcional) otras respuestas que tambien valen ["1","won"]

   Para añadir un tema nuevo: copia un bloque y cámbialo. Nada más.
   ================================================================ */

const TEMAS = [
  {
    id: "animales",
    icono: "🐾",
    nombre: "Animals",
    color: "#ff9f1c",
    palabras: [
      { en: "DOG",   emoji: "🐶" },
      { en: "CAT",   emoji: "🐱" },
      { en: "COW",   emoji: "🐮" },
      { en: "FISH",  emoji: "🐠" },
      { en: "BIRD",  emoji: "🐦" },
      { en: "LION",  emoji: "🦁" },
      { en: "BEAR",  emoji: "🐻" },
      { en: "FROG",  emoji: "🐸" },
      { en: "HORSE", emoji: "🐴" },
      { en: "DUCK",  emoji: "🦆" }
    ]
  },
  {
    id: "espacio",
    icono: "🚀",
    nombre: "Space",
    color: "#8367c7",
    palabras: [
      { en: "STAR",   emoji: "⭐" },
      { en: "MOON",   emoji: "🌙" },
      { en: "SUN",    emoji: "☀️" },
      { en: "ROCKET", emoji: "🚀" },
      { en: "PLANET", emoji: "🪐" },
      { en: "ALIEN",  emoji: "👽" },
      { en: "EARTH",  emoji: "🌍" },
      { en: "COMET",  emoji: "☄️" },
      { en: "CLOUD",  emoji: "☁️" }
    ]
  },
  {
    id: "colores",
    icono: "🎨",
    nombre: "Colors",
    color: "#ff5d8f",
    // en este tema la tarjeta se pinta del color real
    palabras: [
      { en: "RED",    emoji: "🍓", fondo: "#e63946", texto: "#ffffff" },
      { en: "BLUE",   emoji: "🫐", fondo: "#1d7fe0", texto: "#ffffff" },
      { en: "GREEN",  emoji: "🥦", fondo: "#2fa84f", texto: "#ffffff" },
      { en: "YELLOW", emoji: "🍋", fondo: "#ffd400", texto: "#3a2f00" },
      { en: "PINK",   emoji: "🌸", fondo: "#ff8fc3", texto: "#4a0d2a" },
      { en: "ORANGE", emoji: "🍊", fondo: "#ff8c1a", texto: "#3d2100" },
      { en: "PURPLE", emoji: "🍇", fondo: "#8e44ad", texto: "#ffffff" },
      { en: "BROWN",  emoji: "🐻", fondo: "#8b5a2b", texto: "#ffffff" },
      { en: "BLACK",  emoji: "🐈‍⬛", fondo: "#2b2d42", texto: "#ffffff" },
      { en: "WHITE",  emoji: "☁️", fondo: "#ffffff", texto: "#2b2d42" }
    ]
  },
  {
    id: "numeros",
    icono: "🔢",
    nombre: "Numbers",
    color: "#2ec4f1",
    // "cantidad" pinta ese numero de emojis en la tarjeta
    palabras: [
      { en: "ONE",   emoji: "🍎", cantidad: 1,  extra: ["1", "won"] },
      { en: "TWO",   emoji: "🍎", cantidad: 2,  extra: ["2", "to", "too"] },
      { en: "THREE", emoji: "🍎", cantidad: 3,  extra: ["3", "tree"] },
      { en: "FOUR",  emoji: "🍎", cantidad: 4,  extra: ["4", "for"] },
      { en: "FIVE",  emoji: "🍎", cantidad: 5,  extra: ["5"] },
      { en: "SIX",   emoji: "🍎", cantidad: 6,  extra: ["6"] },
      { en: "SEVEN", emoji: "🍎", cantidad: 7,  extra: ["7"] },
      { en: "EIGHT", emoji: "🍎", cantidad: 8,  extra: ["8", "ate"] },
      { en: "NINE",  emoji: "🍎", cantidad: 9,  extra: ["9"] },
      { en: "TEN",   emoji: "🍎", cantidad: 10, extra: ["10"] }
    ]
  },
  {
    id: "comida",
    icono: "🍎",
    nombre: "Food",
    color: "#3ddc84",
    palabras: [
      { en: "APPLE",  emoji: "🍎" },
      { en: "BANANA", emoji: "🍌" },
      { en: "MILK",   emoji: "🥛" },
      { en: "BREAD",  emoji: "🍞" },
      { en: "EGG",    emoji: "🥚" },
      { en: "CAKE",   emoji: "🎂" },
      { en: "WATER",  emoji: "💧" },
      { en: "CHEESE", emoji: "🧀" }
    ]
  }
];

/* Ajustes rapidos del juego */
const AJUSTES = {
  velocidadVoz: 0.8,      // rate del TTS (0.8 = lentito para peques)
  tonoVoz: 1.1,           // pitch (un poco agudo, suena mas amable)
  msAutoAvance: 1500,     // espera antes de pasar de tarjeta al acertar
  msEscuchaMic: 12000,    // cuanto tiempo total escucha el microfono
  reintentosMic: 2,       // reintentos si el peque tarda en hablar
  distanciaMax: 2         // tolerancia de Levenshtein (mas alto = mas permisivo)
};

/* ================================================================
   ⬆⬆⬆  FIN DE LA ZONA DE CONFIGURACION  ⬆⬆⬆
   A partir de aqui es la maquinaria del juego.
   ================================================================ */

const $ = (sel) => document.querySelector(sel);

/* ---------- estado en memoria (sin localStorage) ---------- */
const estado = {
  tema: null,      // objeto del tema activo
  indice: 0,       // tarjeta actual
  bloqueado: false,// true mientras celebra / avanza
  oyendo: false,   // true mientras el mic esta activo
  micOk: false     // el reconocimiento de voz esta disponible
};

/* ================================================================
   1) AUDIO — Web Audio API (sonidos) + desbloqueo iOS
   ================================================================ */
let ctxAudio = null;

function crearContextoAudio(){
  if (ctxAudio) return ctxAudio;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;                 // navegador sin Web Audio: seguimos sin sonido
    ctxAudio = new AC();
  }catch(e){ ctxAudio = null; }
  return ctxAudio;
}

/* iOS deja el contexto "suspended" hasta que hay un toque real.
   Ojo: Safari tambien usa el estado "interrupted" (tras una llamada o bloquear
   la pantalla), por eso comprobamos "distinto de running" y no solo "suspended". */
function despertarAudio(){
  const ctx = crearContextoAudio();
  if (!ctx) return Promise.resolve(false);
  const listo = () => {
    try{
      // un pitido mudo: obliga a iOS a abrir la salida de audio
      const o = ctx.createOscillator(), g = ctx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.03);
    }catch(e){}
    return ctx.state === "running";
  };
  try{
    if (ctx.state !== "running"){
      const p = ctx.resume();
      return (p && typeof p.then === "function")
        ? p.then(listo).catch(()=>false)
        : Promise.resolve(listo());
    }
  }catch(e){ return Promise.resolve(false); }
  return Promise.resolve(listo());
}

/* crea los osciladores: [[frecuencia, cuandoEmpieza, duracion], ...] */
function emitirNotas(ctx, notas, tipo, volumen){
  const t0 = ctx.currentTime;
  notas.forEach(([hz, ini, dur]) => {
    try{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = tipo || "triangle";
      o.frequency.setValueAtTime(hz, t0 + ini);
      const vol = volumen == null ? 0.22 : volumen;
      g.gain.setValueAtTime(0.0001, t0 + ini);
      g.gain.exponentialRampToValueAtTime(vol, t0 + ini + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0 + ini); o.stop(t0 + ini + dur + 0.03);
    }catch(e){}
  });
}

function tocarNotas(notas, tipo, volumen){
  const ctx = crearContextoAudio();
  if (!ctx) return;                       // navegador sin Web Audio: el juego sigue, mudo
  if (ctx.state !== "running"){
    // se durmio (iOS interrumpe el audio al bloquear la pantalla o al recibir una llamada)
    try{
      const p = ctx.resume();
      if (p && typeof p.then === "function"){
        p.then(() => { if (ctx.state === "running") emitirNotas(ctx, notas, tipo, volumen); })
         .catch(()=>{});
        return;
      }
    }catch(e){ return; }
    if (ctx.state !== "running") return;
  }
  emitirNotas(ctx, notas, tipo, volumen);
}

const sonidos = {
  toque:  () => tocarNotas([[660,0,.09]], "square", .12),
  bien:   () => tocarNotas([[523.25,0,.16],[659.25,.11,.16],[783.99,.22,.34]], "triangle", .25),
  otraVez:() => tocarNotas([[392,0,.14],[349.23,.12,.22]], "sine", .16),
  fiesta: () => tocarNotas([
              [523.25,0,.15],[659.25,.12,.15],[783.99,.24,.15],
              [1046.5,.36,.3],[783.99,.52,.15],[1046.5,.64,.5]
            ], "triangle", .25)
};

/* ================================================================
   2) VOZ (TTS) — SpeechSynthesis con carga asincrona de voces
   ================================================================ */
const hayTTS = typeof window.speechSynthesis !== "undefined" &&
               typeof window.SpeechSynthesisUtterance !== "undefined";
let vozElegida = null;

/* nombres de voces que suelen sonar bien y claras en ingles */
const VOCES_PREFERIDAS = ["Samantha","Karen","Moira","Google US English","Microsoft Zira","Allison","Ava","Nicky"];

function elegirVoz(){
  if (!hayTTS) return null;
  let voces = [];
  try{ voces = window.speechSynthesis.getVoices() || []; }catch(e){ voces = []; }
  if (!voces.length) return null;                       // aun no cargaron: reintentamos luego

  const enUS = voces.filter(v => /^en[-_]us$/i.test(v.lang || ""));
  const enX  = voces.filter(v => /^en([-_]|$)/i.test(v.lang || ""));

  // 1) voz preferida en-US  2) cualquier en-US  3) cualquier ingles  4) nada (usamos la del sistema)
  for (const nombre of VOCES_PREFERIDAS){
    const v = enUS.find(x => (x.name||"").indexOf(nombre) !== -1) ||
              enX.find(x => (x.name||"").indexOf(nombre) !== -1);
    if (v) return v;
  }
  return enUS[0] || enX[0] || null;
}

function cargarVoces(){
  const v = elegirVoz();
  if (v) vozElegida = v;
  return v;
}

if (hayTTS){
  cargarVoces();
  // getVoices() suele venir vacio en la primera llamada: escuchamos el evento
  try{ window.speechSynthesis.addEventListener("voiceschanged", cargarVoces); }catch(e){
    try{ window.speechSynthesis.onvoiceschanged = cargarVoces; }catch(e2){}
  }
  // red de seguridad para navegadores que nunca disparan voiceschanged
  let intentos = 0;
  const reintento = setInterval(() => {
    if (cargarVoces() || ++intentos > 20) clearInterval(reintento);
  }, 250);
}

/* Habla programada (la palabra que se dice sola al abrir una tarjeta).
   La guardamos aparte para poder cancelarla: si el peque toca el 🎤 justo
   despues de entrar, este temporizador no debe cortarle el microfono. */
let temporizadorHabla = null;

function programarHabla(texto, ms){
  cancelarHablaPendiente();
  temporizadorHabla = setTimeout(() => {
    temporizadorHabla = null;
    hablar(texto);
  }, ms);
}

function cancelarHablaPendiente(){
  if (temporizadorHabla){ clearTimeout(temporizadorHabla); temporizadorHabla = null; }
}

/* dice una palabra en ingles; nunca revienta si no hay voces */
function hablar(texto, alTerminar){
  if (!hayTTS){ if (alTerminar) alTerminar(); return; }
  try{
    // si el micro esta abierto, lo cerramos: TTS y ASR a la vez se pelean en movil
    pararMic();
    window.speechSynthesis.cancel();
    const decir = () => {
      try{
        const u = new SpeechSynthesisUtterance(texto);
        if (!vozElegida) cargarVoces();
        if (vozElegida){ u.voice = vozElegida; u.lang = vozElegida.lang || "en-US"; }
        else { u.lang = "en-US"; }        // sin voz inglesa: al menos pedimos el idioma
        u.rate   = AJUSTES.velocidadVoz;
        u.pitch  = AJUSTES.tonoVoz;
        u.volume = 1;
        u.onend   = () => { if (alTerminar) alTerminar(); };
        u.onerror = () => { if (alTerminar) alTerminar(); };
        window.speechSynthesis.speak(u);
      }catch(e){ if (alTerminar) alTerminar(); }
    };
    // pequeña pausa: en iOS un cancel() seguido de speak() inmediato se pierde
    setTimeout(decir, 60);
  }catch(e){ if (alTerminar) alTerminar(); }
}

/* la primera vez hay que "estrenar" el TTS dentro de un gesto del usuario */
function desbloquearVoz(){
  if (!hayTTS) return false;
  try{
    const u = new SpeechSynthesisUtterance(" ");   // utterance mudo
    u.volume = 0; u.rate = 1; u.lang = "en-US";
    window.speechSynthesis.speak(u);
    cargarVoces();
    return true;
  }catch(e){ return false; }
}

/* ================================================================
   3) MICROFONO — SpeechRecognition con deteccion de soporte
   ================================================================ */
const ReconocedorVoz = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let reconocedor = null;        // instancia viva: se crea una nueva en cada intento
let temporizadorMic = null;    // corte de seguridad de toda la escucha
let intentosMic = 0;           // reintentos dentro de una misma escucha
let motivoSinMic = "";         // por que no hay micro (para el mensajito de abajo)

/* El microfono SOLO funciona en paginas seguras: https:// , localhost, o el
   archivo abierto directamente. Si sirves el juego por http:// desde otro
   ordenador -por ejemplo http://192.168.1.10:8080 abierto en el iPad- el
   navegador corta el microfono. Lo detectamos antes de enseñar el boton para
   no dejar al peque tocando un boton que nunca va a funcionar. */
function paginaSegura(){
  return window.isSecureContext !== false;
}

function prepararMic(){
  estado.micOk = false;
  if (!ReconocedorVoz){ motivoSinMic = "sin-api"; return false; }   // navegador sin la API
  if (!paginaSegura()){ motivoSinMic = "inseguro"; return false; }  // http:// sin cifrar
  motivoSinMic = "";
  estado.micOk = true;
  return true;
}

/* una instancia nueva por intento: tras un abort() varios navegadores
   (Chrome el primero) dejan la anterior en un estado del que ya no arranca */
function crearReconocedor(){
  if (!ReconocedorVoz) return null;
  try{
    const r = new ReconocedorVoz();
    r.lang = "en-US";
    r.continuous = false;
    r.interimResults = true;    // aprovechamos resultados parciales
    r.maxAlternatives = 5;      // mas opciones = mas posibilidades de acertar
    return r;
  }catch(e){ return null; }
}

const NOTAS_MIC = {
  "inseguro": "🎤 El micrófono necesita una página https",
  "permiso":  "🎤 El micrófono está bloqueado en este navegador",
  "sin-api":  "🎤 El micrófono no está disponible en este dispositivo"
};

function pintarMic(){
  const btn = $("#btnMic"), nota = $("#notaMic");
  if (estado.micOk){ btn.hidden = false; nota.hidden = true; return; }
  btn.hidden = true;
  nota.hidden = false;
  nota.textContent = NOTAS_MIC[motivoSinMic] || NOTAS_MIC["sin-api"];
}

/* suelta la instancia actual sin dejar callbacks sueltos */
function soltarReconocedor(){
  if (!reconocedor) return;
  const r = reconocedor;
  reconocedor = null;
  try{ r.onresult = r.onerror = r.onend = null; }catch(e){}
  try{ r.abort(); }catch(e){
    try{ r.stop(); }catch(e2){}
  }
}

/* apaga el micro pase lo que pase */
function pararMic(){
  estado.oyendo = false;
  intentosMic = 0;
  const btn = $("#btnMic");
  if (btn) btn.classList.remove("oyendo");
  if (temporizadorMic){ clearTimeout(temporizadorMic); temporizadorMic = null; }
  soltarReconocedor();
}

/* el micro no va a funcionar: lo escondemos y seguimos con el boton de tocar */
function fallarMic(motivo){
  motivoSinMic = motivo;
  estado.micOk = false;
  pararMic();
  pintarMic();
  animo("👉 Toca ✅");
}

function escuchar(){
  if (!estado.micOk || estado.bloqueado) return;
  if (estado.oyendo){ pararMic(); animo(""); return; }   // segundo toque = cancelar

  const objetivo = tarjetaActual();
  if (!objetivo) return;

  // el TTS puede estar hablando (o a punto): lo callamos para no oirnos a nosotros mismos
  cancelarHablaPendiente();
  try{ if (hayTTS) window.speechSynthesis.cancel(); }catch(e){}

  intentosMic = 0;
  // corte de seguridad de TODA la escucha: en algunos moviles onend nunca llega
  if (temporizadorMic) clearTimeout(temporizadorMic);
  temporizadorMic = setTimeout(() => {
    if (estado.oyendo){ pararMic(); animo("👉 Toca ✅"); }
  }, AJUSTES.msEscuchaMic);

  intentarEscucha(objetivo);
}

/* OJO: start() tiene que ejecutarse DENTRO del gesto del usuario, sin ningun
   await por delante, o iOS lo rechaza. Por eso NO pedimos permiso con
   getUserMedia antes: el propio start() ya saca el aviso del navegador. */
function intentarEscucha(objetivo){
  soltarReconocedor();
  reconocedor = crearReconocedor();
  if (!reconocedor){ fallarMic("sin-api"); return false; }

  estado.oyendo = true;
  $("#btnMic").classList.add("oyendo");
  animo("👂 ...");

  reconocedor.onresult = (ev) => {
    let acierto = false;
    try{
      for (let i = ev.resultIndex; i < ev.results.length; i++){
        const res = ev.results[i];
        for (let j = 0; j < res.length; j++){
          if (coincide(res[j].transcript, objetivo.en, objetivo.extra)){ acierto = true; break; }
        }
        if (acierto) break;
      }
    }catch(e){ acierto = false; }
    if (acierto){ pararMic(); acertar(); }
  };

  reconocedor.onerror = (ev) => {
    const cod = (ev && ev.error) || "";
    // permanentes: no hay permiso o el navegador no ofrece el servicio
    if (cod === "not-allowed" || cod === "service-not-allowed"){ fallarMic("permiso"); return; }
    // pasajeros ("no-speech", "network", "audio-capture", "aborted"): NO escondemos
    // el boton, que un fallo de red o un silencio no deje al peque sin microfono.
    // De reintentar o rendirse ya se encarga onend.
  };

  reconocedor.onend = () => {
    if (!estado.oyendo) return;          // ya lo paramos nosotros
    // un peque de 4 años tarda en arrancar a hablar: le damos otra oportunidad
    if (intentosMic < AJUSTES.reintentosMic && !estado.bloqueado){
      intentosMic++;
      if (intentarEscucha(objetivo)) return;
    }
    estado.oyendo = false;
    $("#btnMic").classList.remove("oyendo");
    if (temporizadorMic){ clearTimeout(temporizadorMic); temporizadorMic = null; }
    if (!estado.bloqueado) animo("👉 Toca ✅");
  };

  try{
    reconocedor.start();
  }catch(e){
    // start() lanza si ya estaba activo o si el navegador lo prohibe
    estado.oyendo = false;
    $("#btnMic").classList.remove("oyendo");
    soltarReconocedor();
    if (temporizadorMic){ clearTimeout(temporizadorMic); temporizadorMic = null; }
    animo("👉 Toca ✅");
    return false;
  }
  return true;
}

/* ================================================================
   4) COMPARACION DIFUSA — muy permisiva a proposito
   ================================================================ */
function normalizar(s){
  return String(s == null ? "" : s)
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // quita acentos
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

/* distancia de Levenshtein clasica */
function levenshtein(a, b){
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let fila = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) fila[j] = j;
  for (let i = 1; i <= a.length; i++){
    let prev = fila[0]; fila[0] = i;
    for (let j = 1; j <= b.length; j++){
      const tmp = fila[j];
      fila[j] = Math.min(
        fila[j] + 1,                                        // borrar
        fila[j-1] + 1,                                      // insertar
        prev + (a[i-1] === b[j-1] ? 0 : 1)                  // sustituir
      );
      prev = tmp;
    }
  }
  return fila[b.length];
}

/* soundex simplificado: agrupa palabras que SUENAN parecido (dog/dawg, cat/kat) */
function soundex(s){
  const t = normalizar(s).replace(/[^a-z]/g, "");
  if (!t) return "";
  const codigo = { b:1,f:1,p:1,v:1, c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2, d:3,t:3, l:4, m:5,n:5, r:6 };
  let out = t[0].toUpperCase(), ultimo = codigo[t[0]] || 0;
  for (let i = 1; i < t.length && out.length < 4; i++){
    const c = codigo[t[i]] || 0;
    if (c && c !== ultimo) out += c;
    if (t[i] !== "h" && t[i] !== "w") ultimo = c;   // h y w no cortan la repeticion
  }
  return (out + "000").slice(0, 4);
}

/* ¿lo que dijo el peque se parece a la palabra objetivo? */
function coincide(dicho, objetivo, extras){
  const t = normalizar(dicho);
  if (!t) return false;

  const metas = [normalizar(objetivo)]
    .concat((extras || []).map(normalizar))
    .filter(Boolean);

  const dichas = t.split(" ").filter(Boolean);

  for (const meta of metas){
    if (t === meta) return true;
    if (t.indexOf(meta) !== -1) return true;                       // "the dog" contiene "dog"
    if (meta.length >= 3 && meta.indexOf(t) !== -1 && t.length >= 2) return true; // dijo un trocito

    for (const p of dichas){
      if (p === meta) return true;
      const umbral = meta.length <= 2 ? 1 : AJUSTES.distanciaMax;  // palabras de 1-2 letras: mas estricto
      if (levenshtein(p, meta) <= umbral) return true;
      if (soundex(p) === soundex(meta)) return true;               // suena igual
      if (p.length >= 3 && meta.length >= 3 &&
          p.slice(0,3) === meta.slice(0,3)) return true;           // empieza igual
    }
  }
  return false;
}

/* ================================================================
   5) PANTALLAS Y RENDER
   ================================================================ */
function mostrarPantalla(id){
  document.querySelectorAll(".pantalla").forEach(p => p.classList.remove("activa"));
  const p = document.getElementById(id);
  if (p) p.classList.add("activa");
}

function animo(txt){ $("#animo").textContent = txt || ""; }

function tarjetaActual(){
  if (!estado.tema) return null;
  return estado.tema.palabras[estado.indice] || null;
}

/* pinta los botones de temas del home */
function pintarHome(){
  const cont = $("#rejillaTemas");
  cont.innerHTML = "";
  TEMAS.forEach((tema, i) => {
    const b = document.createElement("button");
    b.className = "tema-btn";
    b.style.background = tema.color || "#ff9f1c";
    b.style.animationDelay = (i * 60) + "ms";
    b.setAttribute("aria-label", tema.nombre);
    b.innerHTML = '<span class="ico"></span><span class="nombre"></span>';
    b.querySelector(".ico").textContent = tema.icono;
    b.querySelector(".nombre").textContent = tema.nombre;
    b.addEventListener("click", () => { sonidos.toque(); empezarTema(tema); });
    cont.appendChild(b);
  });
}

/* estrellas de progreso: una por palabra del tema */
function pintarEstrellas(conPop){
  const cont = $("#estrellas");
  const total = estado.tema ? estado.tema.palabras.length : 0;
  if (cont.children.length !== total){
    cont.innerHTML = "";
    for (let i = 0; i < total; i++){
      const s = document.createElement("span");
      s.textContent = "⭐";
      cont.appendChild(s);
    }
  }
  Array.prototype.forEach.call(cont.children, (s, i) => {
    const ganada = i < estado.indice;
    s.classList.toggle("on", ganada);
    if (conPop && i === estado.indice - 1){
      s.classList.remove("pop");
      void s.offsetWidth;              // reinicia la animacion
      s.classList.add("pop");
    }
  });
}

/* dibuja la tarjeta actual */
function pintarTarjeta(){
  const t = tarjetaActual();
  if (!t) return;
  const tarjeta = $("#tarjeta"), dibujo = $("#dibujo"), palabra = $("#palabra");

  // fondo: color real en el tema de colores, blanco en el resto
  tarjeta.style.background = t.fondo || "#ffffff";
  palabra.style.color = t.texto || "var(--oscuro)";

  // numeros: repetimos el emoji "cantidad" veces
  if (t.cantidad && t.cantidad > 1){
    dibujo.className = "grupo";
    dibujo.textContent = "";
    for (let i = 0; i < t.cantidad; i++){
      const e = document.createElement("span");
      e.textContent = t.emoji;
      dibujo.appendChild(e);
    }
  } else {
    dibujo.className = "";
    dibujo.textContent = t.emoji;
  }

  palabra.textContent = t.en;

  // reinicia la animacion de entrada
  tarjeta.style.animation = "none";
  void tarjeta.offsetWidth;
  tarjeta.style.animation = "";

  pintarEstrellas(false);
  animo("");
}

/* ================================================================
   6) FLUJO DEL JUEGO
   ================================================================ */
function empezarTema(tema){
  estado.tema = tema;
  estado.indice = 0;
  estado.bloqueado = false;
  mostrarPantalla("juego");
  pintarMic();
  pintarTarjeta();
  // dice la palabra sola al entrar (ya hay audio desbloqueado por el splash)
  programarHabla(tema.palabras[0].en, 350);
}

function acertar(){
  if (estado.bloqueado) return;
  estado.bloqueado = true;
  pararMic();

  sonidos.bien();
  animo("🎉 ¡Yeah!");
  $("#tarjeta").classList.add("correcto");
  lanzarConfeti(28);

  estado.indice++;
  pintarEstrellas(true);

  setTimeout(() => {
    $("#tarjeta").classList.remove("correcto");
    estado.bloqueado = false;
    if (estado.indice >= estado.tema.palabras.length) terminarTema();
    else { pintarTarjeta(); hablar(tarjetaActual().en); }
  }, AJUSTES.msAutoAvance);
}

function terminarTema(){
  cancelarHablaPendiente();
  mostrarPantalla("final");
  const n = estado.tema.palabras.length;
  $("#estrellasFinal").textContent = new Array(Math.min(n, 10) + 1).join("⭐");
  sonidos.fiesta();
  lanzarConfeti(70);
  setTimeout(() => lanzarConfeti(40), 700);
  hablar("Great job!");
}

function irACasa(){
  pararMic();
  cancelarHablaPendiente();
  try{ if (hayTTS) window.speechSynthesis.cancel(); }catch(e){}
  estado.bloqueado = false;
  mostrarPantalla("home");
}

/* ================================================================
   7) CONFETI
   ================================================================ */
const PIEZAS_CONFETI = ["🎉","⭐","✨","🎈","🌈","💫","🎊","❤️","💛","💙"];

function lanzarConfeti(cantidad){
  const cont = $("#confeti");
  if (!cont) return;
  for (let i = 0; i < cantidad; i++){
    const p = document.createElement("i");
    p.textContent = PIEZAS_CONFETI[(Math.random() * PIEZAS_CONFETI.length) | 0];
    p.style.left = (Math.random() * 96) + "vw";
    p.style.animationDuration = (1.5 + Math.random() * 1.4) + "s";
    p.style.animationDelay = (Math.random() * 0.45) + "s";
    p.style.setProperty("--giro", ((Math.random() * 900) - 450) + "deg");
    cont.appendChild(p);
    setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, 3600);
  }
}

/* ================================================================
   8) ARRANQUE — el toque del splash desbloquea TODO el audio (iOS)
   ================================================================ */
let yaArranco = false;

function arrancar(){
  if (yaArranco) return;
  yaArranco = true;

  // 1) Web Audio: hay que hacerlo DENTRO del gesto del usuario
  despertarAudio().then(() => { sonidos.toque(); });
  // 2) SpeechSynthesis: utterance mudo para "estrenar" la voz en iOS
  desbloquearVoz();
  // 3) Microfono: solo comprobamos si existe la API (el permiso se pide al usarlo)
  prepararMic();
  pintarMic();

  pintarHome();
  mostrarPantalla("home");
}

/* varios eventos por si acaso: en iOS pointerdown/touchend son los mas fiables */
["pointerdown","touchend","click","keydown"].forEach(ev => {
  $("#splash").addEventListener(ev, arrancar, { passive:true });
});

/* botones del juego */
$("#btnEscuchar").addEventListener("click", () => {
  const t = tarjetaActual();
  if (t) hablar(t.en);
});
$("#btnMic").addEventListener("click", escuchar);
$("#btnListo").addEventListener("click", () => {
  // camino principal, no un plan B: siempre avanza
  if (!estado.bloqueado) acertar();
});
$("#btnCasa").addEventListener("click", () => { sonidos.toque(); irACasa(); });
$("#btnHomeFinal").addEventListener("click", () => { sonidos.toque(); irACasa(); });
$("#btnOtraVez").addEventListener("click", () => { sonidos.toque(); empezarTema(estado.tema); });

/* si la pagina se va a segundo plano, callamos todo */
document.addEventListener("visibilitychange", () => {
  if (document.hidden){
    pararMic();
    cancelarHablaPendiente();
    try{ if (hayTTS) window.speechSynthesis.cancel(); }catch(e){}
  } else if (yaArranco){
    despertarAudio();   // iOS deja el audio "interrupted" al volver: lo reanimamos
  }
});

/* ---------- ganchos para pruebas automaticas (no afectan al juego) ---------- */
window.__juego = {
  TEMAS, AJUSTES, estado,
  coincide, levenshtein, soundex, normalizar,
  prepararMic, pintarMic, elegirVoz, despertarAudio, tocarNotas, paginaSegura,
  get ctxAudio(){ return ctxAudio; },
  get vozElegida(){ return vozElegida; }
};
